# Codemagic: builds the iPhone app on a cloud Mac and sends it to TestFlight.
# One-time setup is described in IPHONE.md (App Store Connect API key, bundle id, app record).
workflows:
  ios-testflight:
    name: iPhone → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Charm Unlock API   # the name you give the API key in Codemagic → Team integrations
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mucahitkurkaya.charmunlock
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: 0               # the app's "Apple ID" number from App Store Connect → App Information
        VITE_PACKS_URL: https://KULLANICI_ADI.github.io/charm/packs/
      node: 22
      xcode: latest
    scripts:
      - name: Install
        script: npm ci
      - name: Test (game rules, all levels, translations)
        script: npm test
      - name: Build the game
        script: npm run build
      - name: Copy the game into the iPhone project
        script: npx cap sync ios
      - name: Signing
        script: xcode-project use-profiles
      - name: Build number = latest TestFlight build + 1
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          cd ios/App && agvtool new-version -all $((LATEST + 1))
      - name: Build the .ipa
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
