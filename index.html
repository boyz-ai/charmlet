<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Charm Unlock</title>
<link rel="icon" href="./favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 data-i18n="title">Charm Çözücü</h1><div class="lv" id="lv"></div></div>
    <div class="hbtns">
      <button id="homeBtn" class="icon" data-i18n-aria="home" aria-label="Ana sayfa">⌂</button>
      <button id="setBtn" class="icon" data-i18n-aria="settings" aria-label="Ayarlar">⚙</button>
      <button id="rs" data-i18n="restart">Baştan</button>
    </div>
  </header>

  <div class="box">
    <canvas id="c" aria-label="Board"></canvas>
    <div class="ov" id="ov"><h2 id="ot"></h2><p id="op"></p><button id="ob"></button><button id="ob2" class="ghost"></button></div>

    <section class="ov home" id="home">
      <div class="logo" aria-hidden="true"><span></span><span></span><span></span></div>
      <h2 data-i18n="title">Charm Çözücü</h2>
      <p data-i18n="tagline"></p>
      <button id="playBtn" class="big"></button>
      <p class="small" id="homeStreak"></p>
      <p class="small"><span class="coin" aria-hidden="true"></span> <b id="homeCoins">0</b> <span data-i18n="coins">Altın</span></p>
      <button id="dailyBtn" class="ghost" data-i18n="daily">Günlük ödül</button>
      <button id="homeSet" class="ghost" data-i18n="settings">Ayarlar</button>
    </section>

    <section class="ov sheet" id="daily" role="dialog" aria-modal="true" aria-labelledby="dailyTitle">
      <h2 id="dailyTitle" data-i18n="daily">Günlük ödül</h2>
      <p data-i18n="dailyText"></p>
      <ol class="days" id="days"></ol>
      <button id="dailyClaim" class="big"></button>
      <button id="dailyClose" class="ghost" data-i18n="close">Kapat</button>
    </section>

    <section class="ov sheet" id="settings" role="dialog" aria-modal="true" aria-labelledby="setTitle">
      <h2 id="setTitle" data-i18n="settings">Ayarlar</h2>
      <label class="row"><span data-i18n="sound">Ses</span><input type="checkbox" id="optSound"></label>
      <label class="row"><span data-i18n="vibration">Titreşim</span><input type="checkbox" id="optVib"></label>
      <div class="row"><span data-i18n="language">Dil</span>
        <div class="seg"><button id="langTr" type="button">TR</button><button id="langEn" type="button">EN</button></div>
      </div>
      <button id="setClose" data-i18n="close">Kapat</button>
    </section>
  </div>

  <div class="hudrow"><div class="pill"><span data-i18n="moves">Hamle</span> <b id="mv">0</b></div><div class="pill" id="stPill"><span data-i18n="streak">Seri</span> <b id="st">0</b></div><div class="pill"><span class="coin" aria-hidden="true"></span><b id="cn">0</b></div></div>
  <div class="boosters" role="group" data-i18n-aria="boosters" aria-label="Güçlendiriciler">
    <button class="bst" id="bUndo" data-b="undo"><span class="bi" aria-hidden="true">↶</span><span data-i18n="b.undo">Geri al</span><em></em></button>
    <button class="bst" id="bSlot" data-b="slot"><span class="bi" aria-hidden="true">⊕</span><span data-i18n="b.slot">Ekstra yuva</span><em></em></button>
    <button class="bst" id="bMagnet" data-b="magnet"><span class="bi" aria-hidden="true">🧲</span><span data-i18n="b.magnet">Mıknatıs</span><em></em></button>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <p class="hint" id="hint"></p>
  <p class="note" data-i18n="devNote"></p>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
