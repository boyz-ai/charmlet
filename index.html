<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Charm Unlock</title>
<link rel="icon" href="./favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 data-i18n="title">Charm Çözücü</h1><div class="lv" id="lv"></div></div>
    <div class="hbtns">
      <button id="homeBtn" class="icon" data-i18n-aria="home" aria-label="Ana sayfa">⌂</button>
      <button id="setBtn" class="icon" data-i18n-aria="settings" aria-label="Ayarlar">⚙</button>
      <button id="rs" data-i18n="restart">Baştan</button>
    </div>
  </header>

  <div class="box">
    <canvas id="c" aria-label="Board"></canvas>
    <div class="ov" id="ov"><h2 id="ot"></h2><p id="op"></p><button id="ob"></button><button id="ob2" class="ghost"></button><button id="ob3" class="ghost"></button></div>

    <section class="ov home" id="home">
      <canvas class="homecv" id="homeCv" aria-hidden="true"></canvas>
      <div class="hspace" aria-hidden="true"></div>
      <h2 class="htitle" data-i18n="title">Charm Çözücü</h2>
      <p data-i18n="tagline"></p>
      <button id="playBtn" class="big"></button>
      <p class="small" id="homeStreak"></p>
      <p class="small"><span class="coin" aria-hidden="true"></span> <b id="homeCoins">0</b> <span data-i18n="coins">Altın</span></p>
      <div class="hgrid">
        <button id="workBtn" class="ghost"><span aria-hidden="true">💍</span><span data-i18n="workshop">Atölye</span></button>
        <button id="shopBtn" class="ghost"><span aria-hidden="true">🛍️</span><span data-i18n="shop">Mağaza</span></button>
        <button id="mapBtn" class="ghost"><span aria-hidden="true">🗺️</span><span data-i18n="map">Harita</span></button>
        <button id="homeSet" class="ghost"><span aria-hidden="true">⚙️</span><span data-i18n="settings">Ayarlar</span></button>
      </div>
    </section>

    <section class="ov sheet" id="work" role="dialog" aria-modal="true" aria-labelledby="workTitle">
      <h2 id="workTitle" data-i18n="workshop">Atölye</h2>
      <p class="small"><span class="coin" aria-hidden="true"></span> <b id="workCoins">0</b></p>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="ring" data-i18n="tab.ring">Halkalar</button>
        <button role="tab" data-tab="charm" data-i18n="tab.charm">Charm'lar</button>
        <button role="tab" data-tab="board" data-i18n="tab.board">Tahtalar</button>
        <button role="tab" data-tab="col" data-i18n="tab.col">Koleksiyon</button>
      </div>
      <div class="witems" id="witems"></div>
      <button id="workClose" class="ghost" data-i18n="close">Kapat</button>
    </section>

    <section class="ov sheet" id="map" role="dialog" aria-modal="true" aria-labelledby="mapTitle">
      <div class="maphead">
        <button id="mapPrev" class="icon" data-i18n-aria="prevChapter" aria-label="Önceki">‹</button>
        <div><h2 id="mapTitle"></h2><p id="mapSub" class="small"></p></div>
        <button id="mapNext" class="icon" data-i18n-aria="nextChapter" aria-label="Sonraki">›</button>
      </div>
      <ol class="path" id="path"></ol>
      <button id="mapClose" class="ghost" data-i18n="close">Kapat</button>
    </section>

    <section class="ov sheet" id="shop" role="dialog" aria-modal="true" aria-labelledby="shopTitle">
      <h2 id="shopTitle" data-i18n="shop">Mağaza</h2>
      <p class="small"><span class="coin" aria-hidden="true"></span> <b id="shopCoins">0</b></p>
      <ul class="shop" id="shopList"></ul>
      <p class="small" data-i18n="testNote"></p>
      <button id="shopClose" class="ghost" data-i18n="close">Kapat</button>
    </section>
    <div class="ov td" id="td" role="dialog" aria-modal="true"></div>

    <section class="ov sheet" id="settings" role="dialog" aria-modal="true" aria-labelledby="setTitle">
      <h2 id="setTitle" data-i18n="settings">Ayarlar</h2>
      <label class="row"><span data-i18n="sound">Ses</span><input type="checkbox" id="optSound"></label>
      <label class="row"><span data-i18n="vibration">Titreşim</span><input type="checkbox" id="optVib"></label>
      <div class="row"><span data-i18n="language">Dil</span>
        <select id="langSel" class="lsel" data-i18n-aria="language" aria-label="Dil"></select>
      </div>
      <button id="setClose" data-i18n="close">Kapat</button>
    </section>
  </div>

  <div class="hudrow"><div class="pill"><span data-i18n="moves">Hamle</span> <b id="mv">0</b></div><div class="pill" id="stPill"><span data-i18n="streak">Seri</span> <b id="st">0</b></div><button class="pill coinpill" id="coinPill" data-i18n-aria="shop" aria-label="Mağaza"><span class="coin" aria-hidden="true"></span><b id="cn">0</b> <span class="plus" aria-hidden="true">+</span></button></div>
  <div class="boosters" role="group" data-i18n-aria="boosters" aria-label="Güçlendiriciler">
    <button class="bst" id="bHint" data-b="hint"><span class="bi" aria-hidden="true">💡</span><span data-i18n="b.hint">İpucu</span><em></em></button>
    <button class="bst" id="bUndo" data-b="undo"><span class="bi" aria-hidden="true">↶</span><span data-i18n="b.undo">Geri al</span><em></em></button>
    <button class="bst" id="bSlot" data-b="slot"><span class="bi" aria-hidden="true">⊕</span><span data-i18n="b.slot">Ekstra yuva</span><em></em></button>
    <button class="bst" id="bMagnet" data-b="magnet"><span class="bi" aria-hidden="true">🧲</span><span data-i18n="b.magnet">Mıknatıs</span><em></em></button>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <p class="hint" id="hint"></p>
  <p class="note" data-i18n="devNote"></p>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
